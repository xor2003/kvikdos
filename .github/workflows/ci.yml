name: ci

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  COSMOCC_VERSION: '4.0.2'

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 = gcc 11 / clang 14, ubuntu-24.04 = gcc 13 / clang 18.
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cppcheck clang clang-tidy clang-tools unzip curl

      - name: Check KVM availability
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            if [ -w /dev/kvm ]; then
              echo "available=yes" >> "$GITHUB_OUTPUT"
            else
              echo "available=no" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
          fi
          cat /dev/kvm 2>&1 | head -1 || true

      - name: Build kvikdos (strict warnings)
        run: make kvikdos

      - name: Build guest test binaries
        run: make guest.com cat.com printenv.com waitkey.com malloct.com mallocs.com slowp.com

      - name: Run test suite (KVM)
        if: steps.kvm.outputs.available == 'yes'
        run: make test

      - name: Run arg-parsing tests only (no KVM on runner)
        if: steps.kvm.outputs.available != 'yes'
        run: |
          ./tests/test_cli_parse.sh ./kvikdos
          ./tests/test_cli_matrix.sh ./kvikdos

      - name: Decoder unit test
        run: make test-x86dec

      # Lint gate + sanitizers on the newest leg only: they gate on tool
      # diagnostics whose wording/extra findings vary across tool versions.
      - name: Linters (cppcheck + clang-check + clang-tidy + clang --analyze)
        if: matrix.os == 'ubuntu-24.04'
        run: STATIC_SLOW=1 bash tests/test_static.sh

      - name: Sanitizers (gcc + clang ASan/UBSan)
        if: matrix.os == 'ubuntu-24.04'
        run: bash tests/test_sanitizers.sh

      - name: Install cosmopolitan toolchain
        if: matrix.os == 'ubuntu-24.04'
        run: |
          curl -fsSL -o /tmp/cosmocc.zip "https://cosmo.zip/pub/cosmocc/cosmocc-${{ env.COSMOCC_VERSION }}.zip"
          unzip -q /tmp/cosmocc.zip -d "$HOME/cosmocc"

      - name: Build stripped APE + stage dist (one binary for Linux + Windows)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          make dist \
            COSMOCC="$HOME/cosmocc/bin/x86_64-unknown-cosmo-cc" \
            COOBJCOPY="$HOME/cosmocc/bin/x86_64-linux-cosmo-objcopy"

      - name: Smoke-test APE on Linux via KVM
        if: matrix.os == 'ubuntu-24.04' && steps.kvm.outputs.available == 'yes'
        run: ./dist/kvikdos guest.com ci | grep -F "Hello, World!"

      - name: Upload binaries
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/kvikdos
            dist/kvikdos.com
          if-no-files-found: error

  linux-distro:
    # Other distros in containers on the ubuntu host: exercises different
    # glibc versions (debian, fedora) and a non-glibc libc (alpine/musl)
    # against the same strict C89 build + KVM test suite.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            deps: apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev make nasm
          - image: fedora:42
            deps: dnf install -y gcc make nasm
          - image: alpine:3.21
            deps: apk add --no-cache bash gcc musl-dev linux-headers make nasm
    container:
      image: ${{ matrix.image }}
      options: --device /dev/kvm  # Pass host KVM in; the check below degrades gracefully if absent.
    defaults:
      run:
        shell: sh  # alpine has no bash by default.
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: ${{ matrix.deps }}

      - name: Check KVM availability
        id: kvm
        run: |
          if [ -e /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build kvikdos (strict warnings)
        run: make kvikdos

      - name: Build guest test binaries
        run: make guest.com cat.com printenv.com waitkey.com malloct.com mallocs.com slowp.com

      - name: Run test suite (KVM)
        if: steps.kvm.outputs.available == 'yes'
        run: make test

      - name: Run arg-parsing tests only (no KVM)
        if: steps.kvm.outputs.available != 'yes'
        run: |
          ./tests/test_cli_parse.sh ./kvikdos
          ./tests/test_cli_matrix.sh ./kvikdos

      - name: Decoder unit test
        run: make test-x86dec

  windows:
    runs-on: ${{ matrix.os }}
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Smoke-test APE on Windows (usage banner)
        shell: pwsh
        run: |
          # Usage goes to stderr (exit-1 path on no args), so merge it in. --help
          # exits 0 and prints the same banner.
          $out = .\kvikdos.com --help 2>&1 | Out-String
          $out
          if ($out -notmatch 'run DOS programs') { exit 1 }

      - name: Probe WHPX backend
        shell: pwsh
        run: |
          # GitHub runners have no WHPX: the binary must fail gracefully with
          # a WHPX error, not crash. If a WHPX-capable runner ever runs this,
          # --kvm-check must succeed instead.
          $out = .\kvikdos.com --kvm-check 2>&1 | Out-String
          $out
          if ($out -match 'WinHvPlatform|WHPX|hypervisor') {
            Write-Host 'WHPX unavailable on this runner (expected); graceful failure OK'
          } elseif ($LASTEXITCODE -ne 0) {
            Write-Host 'unexpected failure without WHPX diagnostic'
            exit 1
          }

  release:
    needs: [linux, linux-distro, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Package release assets
        run: |
          cd dist
          chmod 755 kvikdos kvikdos.com
          sha256sum kvikdos kvikdos.com > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          gh release create "${{ github.ref_name }}" \
            --title "kvikdos ${{ github.ref_name }}" \
            --generate-notes \
            kvikdos kvikdos.com SHA256SUMS.txt
