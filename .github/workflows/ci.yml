name: ci

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  COSMOCC_VERSION: '4.0.2'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cppcheck clang clang-tidy clang-tools unzip curl

      - name: Check KVM availability
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            if [ -w /dev/kvm ]; then
              echo "available=yes" >> "$GITHUB_OUTPUT"
            else
              echo "available=no" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
          fi
          cat /dev/kvm 2>&1 | head -1 || true

      - name: Build kvikdos (strict warnings)
        run: make kvikdos

      - name: Build guest test binaries
        run: make guest.com cat.com printenv.com waitkey.com malloct.com mallocs.com slowp.com

      - name: Run test suite (KVM)
        if: steps.kvm.outputs.available == 'yes'
        run: make test

      - name: Run arg-parsing tests only (no KVM on runner)
        if: steps.kvm.outputs.available != 'yes'
        run: |
          ./tests/test_cli_parse.sh ./kvikdos
          ./tests/test_cli_matrix.sh ./kvikdos

      - name: Decoder unit test
        run: make test-x86dec

      - name: Linters (cppcheck + clang-check + clang-tidy + clang --analyze)
        run: bash tests/test_static.sh

      - name: Sanitizers (gcc + clang ASan/UBSan)
        run: bash tests/test_sanitizers.sh

      - name: Install cosmopolitan toolchain
        run: |
          curl -fsSL -o /tmp/cosmocc.zip "https://cosmo.zip/pub/cosmocc/cosmocc-${{ env.COSMOCC_VERSION }}.zip"
          unzip -q /tmp/cosmocc.zip -d "$HOME/cosmocc"

      - name: Build stripped APE (one binary for Linux + Windows)
        run: |
          make kvikdos.ape \
            COSMOCC="$HOME/cosmocc/bin/x86_64-unknown-cosmo-cc" \
            COSTRIP="$HOME/cosmocc/bin/x86_64-unknown-cosmo-strip"

      - name: Smoke-test APE on Linux via KVM
        if: steps.kvm.outputs.available == 'yes'
        run: ./kvikdos.ape guest.com ci | grep -F "Hello, World!"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            kvikdos
            kvikdos.ape
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: linux
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Smoke-test APE on Windows (usage banner)
        shell: pwsh
        run: |
          Copy-Item kvikdos.ape kvikdos.com
          $out = .\kvikdos.com | Out-String
          $out
          if ($out -notmatch 'run DOS programs') { exit 1 }

      - name: Probe WHPX backend
        shell: pwsh
        run: |
          # GitHub runners have no WHPX: the binary must fail gracefully with
          # a WHPX error, not crash. If a WHPX-capable runner ever runs this,
          # --kvm-check must succeed instead.
          $out = .\kvikdos.com --kvm-check 2>&1 | Out-String
          $out
          if ($out -match 'WinHvPlatform|WHPX|hypervisor') {
            Write-Host 'WHPX unavailable on this runner (expected); graceful failure OK'
          } elseif ($LASTEXITCODE -ne 0) {
            Write-Host 'unexpected failure without WHPX diagnostic'
            exit 1
          }

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Package release assets
        run: |
          cd dist
          chmod 755 kvikdos
          cp kvikdos.ape kvikdos.com   # .com extension so Windows runs the APE
          sha256sum kvikdos kvikdos.com kvikdos.ape > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          gh release create "${{ github.ref_name }}" \
            --title "kvikdos ${{ github.ref_name }}" \
            --generate-notes \
            kvikdos kvikdos.com kvikdos.ape SHA256SUMS.txt
